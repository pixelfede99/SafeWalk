; ============================================================================
;  SafeWalk - platformio.ini
;  ----------------------------------------------------------------------------
;  UN solo proyecto con DOS placas, vía múltiples [env:].
;  ¿Por qué un solo proyecto y no dos? Porque ambas placas comparten config.h
;  (deviceId, paths de Firestore), secrets.h y la librería FirebaseRest.
;  Cada [env:] compila UN solo .cpp (el que tiene setup()/loop()) gracias a
;  build_src_filter, así no chocan los múltiples setup()/loop().
;
;  USO:
;    pio run -e devkit -t upload            # firmware principal del DevKit
;    pio run -e esp32cam -t upload          # firmware del ESP32-CAM
;    pio run -e test_hcsr04 -t upload       # un test puntual
;    pio run -e <env> -t monitor            # ver el serial
;
;  Tests DevKit:  test_buzzer test_button test_motor test_hcsr04 test_mpu6050
;                 test_gps test_battery test_wifi_firestore test_trigger_tx
;  Tests CAM:     test_camera test_audio_sd test_trigger_rx
; ============================================================================

[platformio]
default_envs = devkit

; -------- base común a TODO --------
[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
    mikalhart/TinyGPSPlus@^1.0.3
    bblanchon/ArduinoJson@^7.0.4

; ============================================================
;  ESP32 DevKit v1  (cerebro principal)
; ============================================================
[devkit_base]
board = esp32doit-devkit-v1
build_flags = -DBOARD_DEVKIT

[env:devkit]
extends = devkit_base
build_src_filter = -<*> +<devkit/devkit_main.cpp>

[env:test_buzzer]
extends = devkit_base
build_src_filter = -<*> +<devkit/test_buzzer.cpp>

[env:test_button]
extends = devkit_base
build_src_filter = -<*> +<devkit/test_button.cpp>

[env:test_motor]
extends = devkit_base
build_src_filter = -<*> +<devkit/test_motor.cpp>

[env:test_hcsr04]
extends = devkit_base
build_src_filter = -<*> +<devkit/test_hcsr04.cpp>

[env:test_obstacle]
extends = devkit_base
build_src_filter = -<*> +<devkit/test_obstacle.cpp>

[env:test_mpu6050]
extends = devkit_base
build_src_filter = -<*> +<devkit/test_mpu6050.cpp>

[env:test_gps]
extends = devkit_base
build_src_filter = -<*> +<devkit/test_gps.cpp>

[env:test_battery]
extends = devkit_base
build_src_filter = -<*> +<devkit/test_battery.cpp>

[env:test_wifi_firestore]
extends = devkit_base
build_src_filter = -<*> +<devkit/test_wifi_firestore.cpp>

[env:test_trigger_tx]
extends = devkit_base
build_src_filter = -<*> +<devkit/test_trigger_tx.cpp>

; ============================================================
;  ESP32-CAM AI-Thinker  (cámara + audio)
;  Cámara necesita una partición de app grande -> huge_app.
;  PSRAM habilitada para el frame buffer.
; ============================================================
[esp32cam_base]
board = esp32cam
board_build.partitions = huge_app.csv
build_flags =
    -DBOARD_ESP32CAM
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

[env:esp32cam]
extends = esp32cam_base
monitor_speed = 9600
build_src_filter = -<*> +<esp32cam/esp32cam_main.cpp>

[env:test_camera]
extends = esp32cam_base
build_src_filter = -<*> +<esp32cam/test_camera.cpp>

[env:test_audio_sd]
extends = esp32cam_base
build_src_filter = -<*> +<esp32cam/test_audio_sd.cpp>

[env:test_trigger_rx]
extends = esp32cam_base
monitor_speed = 9600
build_src_filter = -<*> +<esp32cam/test_trigger_rx.cpp>
